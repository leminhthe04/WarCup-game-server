spring.application.name=myapp

api.prefix=/api/v1

# Disable DataSource auto-configuration since we're using MongoDB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration



# Comment all these *.properties files when deploy
# spring.config.import=env.properties
# spring.config.import=vps-env.properties
# spring.config.import=publish-env.properties
# spring.config.import=docker.env.properties
# spring.config.import=publish-env.properties



spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.database=${MONGODB_DB_NAME}
# spring.data.mongodb.username=${MONGODB_USERNAME:}
# spring.data.mongodb.password=${MONGODB_PASSWORD:}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# ==========================================
# CẤU HÌNH LOGGING ĐỂ XUẤT RA FILE
# ==========================================

# 1. Định dạng múi giờ Việt Nam
logging.pattern.dateformat=yyyy-MM-dd'T'HH:mm:ss.SSS,Asia/Ho_Chi_Minh

# 2. Tắt hoàn toàn việc in log ra màn hình console
logging.pattern.console=

# 3. Đường dẫn tuyệt đối lưu file log bên trong container
logging.file.name=/app/logs/app.log

# 4. Định dạng từng dòng log ghi vào file
logging.pattern.file=%d{${logging.pattern.dateformat}} %-5level %logger{36} - %msg%n

# 5. Cấu hình tự động cắt file log (Cực kỳ quan trọng để không bao giờ bị đầy ổ cứng)
# Mỗi khi file vượt quá 10MB, nó sẽ tự động được nén lại và chuyển sang ngày mới
logging.logback.rollingpolicy.file-name-pattern=/app/logs/app-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# 6. Phân quyền hiển thị Log (Level)
logging.level.root=INFO
# logging.level.com.server.game=DEBUG
# logging.level.org.springframework.messaging=DEBUG

# =====================================


jwt.secret=${JWT_SECRET}
# in seconds
jwt.valid-duration:${JWT_VALID_DURATION}
# in seconds
jwt.refresh-duration:${JWT_REFRESH_DURATION}

server.address=${SPRING_SERVER_ADDRESS}
server.port=${SPRING_SERVER_PORT}


netty.server.address=${NETTY_SERVER_ADDRESS}
netty.server.port=${NETTY_SERVER_PORT}


game.tick-interval-ms=33


